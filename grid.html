<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Automark – صانع الجريد</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --orange:#FF6B1A;
  --orange-light:#FFF0E5;
  --orange-border:#FFD4B8;
  --text:#0D0D0D;
  --text-muted:#6E6E6E;
  --bg:#F5F5F0;
  --white:#FFFFFF;
  --surface:#F3F3F0;
  --border:#E5E5E0;
  --green:#22C55E;
  --radius:14px;
  --shadow:0 4px 20px rgba(0,0,0,.08);
}

body{
  font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  background:var(--bg);
  min-height:100vh;
  padding:24px 16px 48px;
  color:var(--text);
}

/* ── Top Bar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  max-width:480px;margin:0 auto 28px;
}
.logo{font-size:20px;font-weight:800;color:#111}
.logo b{color:var(--orange)}
.back-btn{
  font-size:13px;font-weight:600;color:var(--orange);
  text-decoration:none;display:flex;align-items:center;gap:4px;
  background:var(--orange-light);border:1px solid var(--orange-border);
  border-radius:10px;padding:6px 12px;
}

/* ── Card ── */
.card{
  max-width:480px;margin:0 auto 16px;
  background:var(--white);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;
}
.card-title{font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.step-num{
  width:22px;height:22px;border-radius:50%;
  background:var(--orange);color:#fff;
  font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ── Upload Zone ── */
.upload-zone{
  border:2px dashed var(--border);border-radius:var(--radius);
  padding:28px 16px;text-align:center;cursor:pointer;
  transition:border-color .2s,background .2s;
  background:var(--bg);
}
.upload-zone:hover,.upload-zone.drag{
  border-color:var(--orange);background:var(--orange-light);
}
.upload-icon{font-size:36px;margin-bottom:8px}
.upload-label{font-size:14px;font-weight:600;color:var(--text)}
.upload-sub{font-size:12px;color:var(--text-muted);margin-top:4px}
#fileInput{display:none}

/* ── Thumbnails Grid ── */
.thumbs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;
}
.thumb{
  position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;
  border:3px solid transparent;transition:border-color .18s,transform .18s;
}
.thumb.selected{border-color:var(--orange);transform:scale(.97)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-check{
  position:absolute;top:5px;right:5px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;opacity:0;transition:opacity .18s;
}
.thumb.selected .thumb-check{opacity:1}
.thumb-del{
  position:absolute;top:5px;left:5px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .18s;cursor:pointer;
}
.thumb:hover .thumb-del{opacity:1}
.sel-count{
  font-size:12px;font-weight:600;color:var(--orange);margin-top:10px;text-align:center;
}

/* ── Caption ── */
textarea{
  width:100%;border:1.5px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:14px;line-height:1.7;
  font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  color:var(--text);background:var(--bg);
  resize:vertical;min-height:100px;
  transition:border-color .2s;outline:none;
}
textarea:focus{border-color:var(--orange)}
textarea::placeholder{color:#BBBBB5}

/* ── Grid Style Options ── */
.options{display:flex;gap:8px;flex-wrap:wrap}
.opt-btn{
  padding:8px 14px;border-radius:50px;
  font-size:12px;font-weight:600;
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--text-muted);cursor:pointer;transition:all .18s;
}
.opt-btn.active{
  background:var(--orange-light);border-color:var(--orange-border);color:var(--orange);
}

/* ── Preview Canvas ── */
.preview-wrap{
  border-radius:var(--radius);overflow:hidden;
  background:#000;position:relative;
  border:1.5px solid var(--border);
}
#previewCanvas{
  width:100%;height:auto;display:block;
}
.preview-empty{
  aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--bg);gap:8px;
}
.preview-empty-icon{font-size:40px;opacity:.3}
.preview-empty-txt{font-size:13px;color:var(--text-muted)}

/* ── Action Button ── */
.btn-build{
  width:100%;padding:16px;border-radius:var(--radius);
  background:linear-gradient(135deg,#FF7A35,#E84E00);
  color:#fff;font-size:15px;font-weight:700;
  font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  border:none;cursor:pointer;
  box-shadow:0 8px 24px rgba(232,78,0,.25);
  transition:transform .18s,box-shadow .18s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-build:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(232,78,0,.35)}
.btn-build:active{transform:scale(.98)}
.btn-build:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

.btn-dl{
  width:100%;padding:14px;border-radius:var(--radius);
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--text);font-size:14px;font-weight:700;
  font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-dl:hover{background:#EBEBEB}

/* ── Caption Copy Box ── */
.caption-box{
  background:var(--bg);border:1.5px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:13px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
  color:var(--text);
}
.copy-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.copy-label{font-size:12px;font-weight:700;color:var(--text-muted)}
.copy-btn{
  font-size:11px;font-weight:700;color:var(--orange);
  background:var(--orange-light);border:1px solid var(--orange-border);
  border-radius:8px;padding:4px 10px;cursor:pointer;
  font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  transition:opacity .15s;
}
.copy-btn:hover{opacity:.75}

/* ── Toast ── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#111;color:#fff;font-size:13px;font-weight:600;
  padding:10px 22px;border-radius:50px;
  transition:transform .3s ease,opacity .3s ease;opacity:0;pointer-events:none;
  font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo">Auto<b>mark</b></div>
  <a class="back-btn" href="index.html">← الرئيسية</a>
</div>

<!-- Step 1: Upload -->
<div class="card">
  <div class="card-title"><div class="step-num">١</div> ارفع الصور</div>
  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon">🖼️</div>
    <div class="upload-label">اضغط أو اسحب الصور هنا</div>
    <div class="upload-sub">PNG, JPG – يمكن رفع أكثر من صورة</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>
  <div class="thumbs" id="thumbsGrid"></div>
  <div class="sel-count" id="selCount" style="display:none"></div>
</div>

<!-- Step 2: Caption -->
<div class="card">
  <div class="card-title"><div class="step-num">٢</div> اكتب التكست (الكابشن)</div>
  <textarea id="caption" placeholder="اكتب نص البوست هنا...&#10;مثال: تويوتا كامري 2024 – السعر ١٢٠,٠٠٠ ريال 🔥 تواصل على الواتس 05xxxxxxxx"></textarea>
</div>

<!-- Step 3: Style -->
<div class="card">
  <div class="card-title"><div class="step-num">٣</div> شكل الجريد</div>
  <div class="options">
    <button class="opt-btn active" data-gap="4">فراغ رفيع</button>
    <button class="opt-btn" data-gap="0">بدون فراغ</button>
    <button class="opt-btn" data-gap="12">فراغ عريض</button>
  </div>
</div>

<!-- Step 4: Build -->
<div class="card">
  <div class="card-title"><div class="step-num">٤</div> توليد الصورة</div>
  <button class="btn-build" id="buildBtn" disabled>
    <span>⚡</span> إنشاء الجريد
  </button>
</div>

<!-- Step 5: Result -->
<div class="card" id="resultCard" style="display:none">
  <div class="card-title"><div class="step-num">٥</div> النتيجة – احفظ وارفع</div>

  <div class="preview-wrap">
    <canvas id="previewCanvas"></canvas>
  </div>

  <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
    <button class="btn-build" id="dlBtn">
      <span>💾</span> تحميل الصورة
    </button>
  </div>

  <div style="margin-top:16px">
    <div class="copy-row">
      <div class="copy-label">الكابشن جاهز للنسخ</div>
      <button class="copy-btn" id="copyBtn">نسخ</button>
    </div>
    <div class="caption-box" id="captionBox"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const uploadZone = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');
const thumbsGrid = document.getElementById('thumbsGrid');
const selCount   = document.getElementById('selCount');
const buildBtn   = document.getElementById('buildBtn');
const resultCard = document.getElementById('resultCard');
const previewCanvas = document.getElementById('previewCanvas');
const dlBtn      = document.getElementById('dlBtn');
const copyBtn    = document.getElementById('copyBtn');
const captionBox = document.getElementById('captionBox');
const captionTA  = document.getElementById('caption');

let images   = [];   // {id, img, src}
let selected = new Set();
let gapSize  = 4;
let nextId   = 0;

/* ── Upload ── */
uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(files) {
  [...files].forEach(f => {
    if (!f.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const id = nextId++;
        images.push({id, img, src: e.target.result});
        renderThumbs();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
  fileInput.value = '';
}

function renderThumbs() {
  thumbsGrid.innerHTML = '';
  images.forEach(({id, src}) => {
    const el = document.createElement('div');
    el.className = 'thumb' + (selected.has(id) ? ' selected' : '');
    el.dataset.id = id;
    el.innerHTML = `
      <img src="${src}" alt="">
      <div class="thumb-check">✓</div>
      <div class="thumb-del" data-del="${id}">✕</div>
    `;
    el.addEventListener('click', e => {
      if (e.target.dataset.del) return;
      toggleSelect(id);
    });
    el.querySelector('.thumb-del').addEventListener('click', e => {
      e.stopPropagation();
      deleteImage(id);
    });
    thumbsGrid.appendChild(el);
  });
  updateSelCount();
}

function toggleSelect(id) {
  selected.has(id) ? selected.delete(id) : selected.add(id);
  renderThumbs();
}

function deleteImage(id) {
  images = images.filter(i => i.id !== id);
  selected.delete(id);
  renderThumbs();
}

function updateSelCount() {
  const n = selected.size;
  if (n === 0) {
    selCount.style.display = 'none';
  } else {
    selCount.style.display = 'block';
    selCount.textContent = `${n} صورة محددة — اضغط لإلغاء التحديد`;
  }
  buildBtn.disabled = n < 1;
}

/* ── Gap Options ── */
document.querySelectorAll('.opt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gapSize = parseInt(btn.dataset.gap);
  });
});

/* ── Grid Layout ── */
function getLayout(n) {
  if (n === 1) return [1, 1];
  if (n === 2) return [2, 1];
  if (n === 3) return [3, 1];
  if (n === 4) return [2, 2];
  if (n <= 6)  return [3, 2];
  return [3, 3];
}

/* ── Build ── */
buildBtn.addEventListener('click', buildGrid);

function buildGrid() {
  const sel = images.filter(i => selected.has(i.id));
  if (!sel.length) return;

  const SIZE   = 1080;
  const TEXT_H = captionTA.value.trim() ? 0 : 0; // text goes below as caption, not on image
  const [cols, rows] = getLayout(sel.length);
  const gap    = gapSize;

  const cellW  = Math.floor((SIZE - gap * (cols - 1)) / cols);
  const cellH  = Math.floor((SIZE - gap * (rows - 1)) / rows);
  const totalH = SIZE;

  previewCanvas.width  = SIZE;
  previewCanvas.height = totalH;

  const ctx = previewCanvas.getContext('2d');
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, SIZE, totalH);

  sel.forEach((item, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const x   = col * (cellW + gap);
    const y   = row * (cellH + gap);

    // Cover fit
    const img   = item.img;
    const scale = Math.max(cellW / img.width, cellH / img.height);
    const sw    = cellW / scale;
    const sh    = cellH / scale;
    const sx    = (img.width  - sw) / 2;
    const sy    = (img.height - sh) / 2;

    ctx.drawImage(img, sx, sy, sw, sh, x, y, cellW, cellH);
  });

  // Show result
  resultCard.style.display = 'block';
  resultCard.scrollIntoView({behavior:'smooth', block:'start'});

  const caption = captionTA.value.trim();
  captionBox.textContent = caption || '(لا يوجد كابشن)';
}

/* ── Download ── */
dlBtn.addEventListener('click', () => {
  const link  = document.createElement('a');
  link.download = `automark-grid-${Date.now()}.png`;
  link.href = previewCanvas.toDataURL('image/png');
  link.click();
  toast('تم تحميل الصورة ✓');
});

/* ── Copy Caption ── */
copyBtn.addEventListener('click', () => {
  const txt = captionTA.value.trim();
  if (!txt) { toast('لا يوجد كابشن للنسخ'); return; }
  navigator.clipboard.writeText(txt).then(() => toast('تم نسخ الكابشن ✓'));
});

/* ── Toast ── */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
