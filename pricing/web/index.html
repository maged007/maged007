<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محرّك تسعير السيارات المستعملة — الإمارات 🇦🇪</title>
<style>
  :root{
    --bg:#0e1726; --card:#16213a; --line:#26324d; --txt:#e8edf7;
    --muted:#93a1bf; --accent:#3da9fc; --accent2:#23c486; --warn:#f4a261;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
    background:linear-gradient(160deg,#0b1220,#101b30); color:var(--txt);
    min-height:100vh; padding:18px;
  }
  .wrap{max-width:560px; margin:0 auto}
  h1{font-size:20px; margin:6px 0 2px; text-align:center}
  .sub{color:var(--muted); text-align:center; font-size:13px; margin-bottom:18px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px}
  select,input{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:#0f1830; color:var(--txt); font-size:15px; font-family:inherit;
  }
  .row{display:flex; gap:12px}
  .row>div{flex:1}
  button{
    width:100%; margin-top:18px; padding:13px; border:0; border-radius:12px;
    background:linear-gradient(90deg,var(--accent),#2f7fd4); color:#fff;
    font-size:16px; font-weight:700; cursor:pointer;
  }
  button:active{transform:translateY(1px)}
  .price{font-size:34px; font-weight:800; color:var(--accent2); text-align:center; margin:4px 0}
  .price small{font-size:16px; color:var(--muted); font-weight:500}
  .ttl{text-align:center; color:var(--muted); font-size:13px}
  table{width:100%; border-collapse:collapse; margin-top:14px; font-size:13.5px}
  td{padding:7px 4px; border-bottom:1px solid var(--line)}
  td:last-child{text-align:left; color:var(--txt); font-variant-numeric:tabular-nums}
  td:first-child{color:var(--muted)}
  .hide{display:none}
  .note{color:var(--warn); font-size:12px; text-align:center; margin-top:14px; line-height:1.6}
  .err{color:#ff7a7a; text-align:center; margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>محرّك تسعير السيارات المستعملة 🇦🇪</h1>
  <div class="sub">تقدير سعر إعادة البيع — مرساة على سعر الوكيل (السوق الإماراتي)</div>

  <div class="card">
    <div class="row">
      <div>
        <label>البراند</label>
        <select id="brand"></select>
      </div>
      <div>
        <label>الموديل</label>
        <select id="model"></select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>سنة الصنع</label>
        <select id="year"></select>
      </div>
      <div>
        <label>الكيلومترات</label>
        <input id="km" type="number" min="0" step="1000" value="80000" inputmode="numeric">
      </div>
    </div>

    <label>المواصفات</label>
    <select id="spec">
      <option value="gcc">خليجي (GCC)</option>
      <option value="imported">وارد (أمريكي/كندي)</option>
    </select>

    <label>الحالة</label>
    <select id="condition">
      <option value="excellent">ممتازة</option>
      <option value="very_good" selected>جيدة جداً</option>
      <option value="good">جيدة</option>
      <option value="fair">مقبولة</option>
      <option value="needs_work">تحتاج صيانة</option>
    </select>

    <button id="calc">احسب السعر التقديري</button>
    <div id="err" class="err"></div>
  </div>

  <div id="result" class="card hide">
    <div class="ttl">السعر التقديري لإعادة البيع</div>
    <div class="price"><span id="priceVal">—</span> <small>درهم</small></div>
    <table id="breakdown"></table>
  </div>

  <div class="note">
    ⚠️ القيم مبنية على معاملات قابلة للتعديل في ملف البيانات. للحصول على دقة سوقية حقيقية،
    عايِر المحرّك بإعلانات يدوية فعلية عبر <code>calibrate.py</code>.
  </div>
</div>

<script>window.PRICING_DATA = {"_meta": {"currency": "AED", "market": "UAE", "description": "محرّك تسعير السيارات المستعملة — مرساة على سعر الوكيل. كل القيم نِسب مئوية قابلة للتعديل.", "equation": "price = dealer_price[trim] * brand_retention(age) * demand_factor[model] * km_factor * spec_factor * condition_factor", "unified_base": "ناتج (ممتازة) ≈ سعر الإعلان × 0.88", "ad_to_sale_ratio": 0.88}, "retention_tiers": {"_doc": "احتفاظ البراند = الإهلاك العام. first_year_drop = خصم السنة الأولى، annual_drop = خصم كل سنة بعدها. retention(age) = (1-first_year_drop) * (1-annual_drop)^(age-1), age>=1 ; retention(0)=1. collectible = موديلات تحتفظ شبه كاملة (مثل G-Class).", "collectible": {"first_year_drop": 0.03, "annual_drop": 0.03, "floor": 0.85}, "high": {"first_year_drop": 0.15, "annual_drop": 0.075, "floor": 0.18}, "medium": {"first_year_drop": 0.2, "annual_drop": 0.11, "floor": 0.12}, "low": {"first_year_drop": 0.25, "annual_drop": 0.14, "floor": 0.08}, "german": {"first_year_drop": 0.28, "annual_drop": 0.165, "floor": 0.06}}, "brand_tier": {"toyota": "high", "lexus": "high", "honda": "medium", "mitsubishi": "medium", "hyundai": "medium", "kia": "medium", "nissan": "low", "ford": "low", "mercedes": "german", "bmw": "german"}, "km_factor": {"_doc": "كم أكتر = أرخص. expected_km = age * baseline_km_per_year. كل 10,000 كم فوق المتوقع تخصم step_per_10k، وتحت المتوقع تزيد بنفس النسبة. القيمة محصورة بين min/max.", "baseline_km_per_year": 20000, "step_per_10k": 0.02, "min": 0.8, "max": 1.12}, "spec_factor": {"_doc": "خليجي (GCC) كامل القيمة. وارد (أمريكي/كندي) ينخفض ~35% (الافتراضي العام).", "gcc": 1.0, "imported": 0.65}, "spec_factor_by_brand": {"_doc": "تجاوز معامل الوارد لكل براند (فجوة خليجي/وارد تختلف بالبراند). إن غاب براند تُستخدم spec_factor العامة.", "toyota": {"imported": 0.66}, "nissan": {"imported": 0.64}, "honda": {"imported": 0.66}, "mitsubishi": {"imported": 0.65}, "hyundai": {"imported": 0.63}, "kia": {"imported": 0.63}, "lexus": {"imported": 0.68}, "mercedes": {"imported": 0.6}, "bmw": {"imported": 0.6}, "ford": {"imported": 0.7}}, "condition_factor": {"_doc": "5 شرائح. ممتازة = القيمة الأساسية قبل خصم الحالة.", "excellent": 1.0, "very_good": 0.93, "good": 0.86, "fair": 0.75, "needs_work": 0.62}, "brands": {"toyota": {"label": "تويوتا", "models": {"corolla": {"label": "كورولا", "dealer_price": 95000, "demand_factor": 0.916, "type": "sedan"}, "camry": {"label": "كامري", "dealer_price": 130000, "demand_factor": 0.94, "type": "sedan"}, "land_cruiser": {"label": "لاندكروزر", "dealer_price": 320000, "demand_factor": 1.148, "type": "suv"}, "prado": {"label": "برادو", "dealer_price": 230000, "demand_factor": 1.179, "type": "suv"}, "rav4": {"label": "RAV4", "dealer_price": 130000, "demand_factor": 1.004, "type": "suv"}}}, "nissan": {"label": "نيسان", "models": {"altima": {"label": "التيما", "dealer_price": 105000, "demand_factor": 1.071, "type": "sedan"}, "sunny": {"label": "صني", "dealer_price": 70000, "demand_factor": 1.073, "type": "sedan"}, "patrol": {"label": "باترول", "dealer_price": 290000, "demand_factor": 0.933, "type": "suv", "retention_tier": "high"}, "x_trail": {"label": "إكس-تريل", "dealer_price": 115000, "demand_factor": 1.089, "type": "suv"}, "kicks": {"label": "كيكس", "dealer_price": 78000, "demand_factor": 1.013, "type": "suv"}}}, "honda": {"label": "هوندا", "models": {"civic": {"label": "سيفيك", "dealer_price": 100000, "demand_factor": 1.077, "type": "sedan"}, "accord": {"label": "أكورد", "dealer_price": 135000, "demand_factor": 1.008, "type": "sedan"}, "crv": {"label": "CR-V", "dealer_price": 130000, "demand_factor": 1.128, "type": "suv"}, "pilot": {"label": "بايلوت", "dealer_price": 200000, "demand_factor": 1.019, "type": "suv"}, "city": {"label": "سيتي", "dealer_price": 80000, "demand_factor": 1.016, "type": "sedan"}}}, "mitsubishi": {"label": "ميتسوبيشي", "models": {"pajero": {"label": "باجيرو", "dealer_price": 175000, "demand_factor": 1.08, "type": "suv"}, "lancer": {"label": "لانسر", "dealer_price": 75000, "demand_factor": 0.972, "type": "sedan"}, "attrage": {"label": "أتراج", "dealer_price": 60000, "demand_factor": 1.003, "type": "sedan"}, "montero_sport": {"label": "مونتيرو سبورت", "dealer_price": 150000, "demand_factor": 1.062, "type": "suv"}, "l200": {"label": "L200", "dealer_price": 110000, "demand_factor": 1.117, "type": "pickup"}}}, "hyundai": {"label": "هيونداي", "models": {"elantra": {"label": "إلنترا", "dealer_price": 90000, "demand_factor": 1.024, "type": "sedan"}, "tucson": {"label": "توسان", "dealer_price": 120000, "demand_factor": 1.029, "type": "suv"}, "sonata": {"label": "سوناتا", "dealer_price": 115000, "demand_factor": 0.969, "type": "sedan"}, "santafe": {"label": "سنتافي", "dealer_price": 150000, "demand_factor": 1.061, "type": "suv"}, "creta": {"label": "كريتا", "dealer_price": 85000, "demand_factor": 1.03, "type": "suv"}}}, "kia": {"label": "كيا", "models": {"sportage": {"label": "سبورتاج", "dealer_price": 115000, "demand_factor": 1.072, "type": "suv"}, "k5": {"label": "K5", "dealer_price": 110000, "demand_factor": 0.966, "type": "sedan"}, "cerato": {"label": "سيراتو", "dealer_price": 85000, "demand_factor": 1.033, "type": "sedan"}, "sorento": {"label": "سورينتو", "dealer_price": 150000, "demand_factor": 1.028, "type": "suv"}, "picanto": {"label": "بيكانتو", "dealer_price": 60000, "demand_factor": 1.028, "type": "sedan"}}}, "lexus": {"label": "لكزس", "models": {"es": {"label": "ES", "dealer_price": 200000, "demand_factor": 1.004, "type": "sedan"}, "rx": {"label": "RX", "dealer_price": 280000, "demand_factor": 1.079, "type": "suv"}, "lx": {"label": "LX", "dealer_price": 550000, "demand_factor": 1.158, "type": "suv"}, "gx": {"label": "GX", "dealer_price": 350000, "demand_factor": 1.133, "type": "suv"}, "nx": {"label": "NX", "dealer_price": 230000, "demand_factor": 0.962, "type": "suv"}}}, "mercedes": {"label": "مرسيدس", "models": {"c_class": {"label": "C-Class", "dealer_price": 230000, "demand_factor": 1.175, "type": "sedan"}, "e_class": {"label": "E-Class", "dealer_price": 320000, "demand_factor": 1.139, "type": "sedan"}, "s_class": {"label": "S-Class", "dealer_price": 600000, "demand_factor": 1.006, "type": "sedan"}, "glc": {"label": "GLC", "dealer_price": 280000, "demand_factor": 1.27, "type": "suv"}, "g_class": {"label": "G-Class", "dealer_price": 850000, "demand_factor": 1.057, "type": "suv", "retention_tier": "collectible"}}}, "bmw": {"label": "BMW", "models": {"series3": {"label": "الفئة الثالثة", "dealer_price": 230000, "demand_factor": 1.163, "type": "sedan"}, "series5": {"label": "الفئة الخامسة", "dealer_price": 320000, "demand_factor": 1.089, "type": "sedan"}, "x5": {"label": "X5", "dealer_price": 400000, "demand_factor": 1.279, "type": "suv"}, "series7": {"label": "الفئة السابعة", "dealer_price": 600000, "demand_factor": 0.971, "type": "sedan"}, "x6": {"label": "X6", "dealer_price": 450000, "demand_factor": 1.216, "type": "suv"}}}, "ford": {"label": "فورد", "models": {"explorer": {"label": "إكسبلورر", "dealer_price": 180000, "demand_factor": 1.102, "type": "suv"}, "mustang": {"label": "موستانج", "dealer_price": 200000, "demand_factor": 1.174, "type": "coupe"}, "edge": {"label": "إيدج", "dealer_price": 150000, "demand_factor": 1.094, "type": "suv"}, "f150": {"label": "F-150", "dealer_price": 220000, "demand_factor": 1.208, "type": "pickup"}, "expedition": {"label": "إكسبيديشن", "dealer_price": 280000, "demand_factor": 1.18, "type": "suv"}}}}};</script>
<script>
const D = window.PRICING_DATA;
const CUR_YEAR = 2026;
const $ = id => document.getElementById(id);

// ——— نفس معادلة المحرّك (engine.py) بالـJS ———
function modelRetention(brand, model, age){
  // تجاوز طبقة الاحتفاظ لكل موديل إن وُجد، وإلا طبقة البراند
  const tierName = D.brands[brand].models[model].retention_tier || D.brand_tier[brand];
  const tier = D.retention_tiers[tierName];
  if(age <= 0) return 1.0;
  const r = (1 - tier.first_year_drop) * Math.pow(1 - tier.annual_drop, age - 1);
  return Math.max(r, tier.floor);
}
function specFactor(brand, spec){
  // تجاوز معامل الوارد لكل براند إن وُجد، وإلا القيمة العامة
  const bb = (D.spec_factor_by_brand || {})[brand];
  if(bb && bb[spec] !== undefined) return bb[spec];
  return D.spec_factor[spec];
}
function kmFactor(age, km){
  const c = D.km_factor;
  const expected = Math.max(age,0) * c.baseline_km_per_year;
  const factor = 1 - ((km - expected)/10000) * c.step_per_10k;
  return Math.max(c.min, Math.min(c.max, factor));
}
function estimate(brand, model, age, km, spec, condition){
  const m = D.brands[brand].models[model];
  const f = {
    dealer_price:    m.dealer_price,
    brand_retention: modelRetention(brand, model, age),
    demand_factor:   m.demand_factor,
    km_factor:       kmFactor(age, km),
    spec_factor:     specFactor(brand, spec),
    condition_factor:D.condition_factor[condition],
  };
  const price = f.dealer_price * f.brand_retention * f.demand_factor *
                f.km_factor * f.spec_factor * f.condition_factor;
  return {price: Math.round(price), f};
}

// ——— تعبئة القوائم ———
function fillBrands(){
  const b = $('brand');
  Object.entries(D.brands).forEach(([k,v]) =>
    b.add(new Option(v.label, k)));
  fillModels();
}
function fillModels(){
  const b = $('brand').value, m = $('model');
  m.innerHTML = '';
  Object.entries(D.brands[b].models).forEach(([k,v]) =>
    m.add(new Option(v.label, k)));
}
function fillYears(){
  const y = $('year');
  for(let yr = CUR_YEAR; yr >= CUR_YEAR-15; yr--)
    y.add(new Option(yr, yr));
  y.value = CUR_YEAR - 4;
}

const fmt = n => n.toLocaleString('en-US');
const pct = n => (n*100).toFixed(1) + '%';

function calc(){
  $('err').textContent = '';
  const brand = $('brand').value, model = $('model').value;
  const age = CUR_YEAR - parseInt($('year').value, 10);
  const km = parseInt($('km').value, 10);
  if(isNaN(km) || km < 0){ $('err').textContent = 'أدخل كيلومترات صحيحة'; return; }

  const {price, f} = estimate(brand, model, age, km,
                              $('spec').value, $('condition').value);
  $('priceVal').textContent = fmt(price);
  $('breakdown').innerHTML = `
    <tr><td>سعر الوكيل (جديد)</td><td>${fmt(f.dealer_price)} د</td></tr>
    <tr><td>احتفاظ البراند (${age} سنة)</td><td>${pct(f.brand_retention)}</td></tr>
    <tr><td>عامل الطلب للموديل</td><td>${pct(f.demand_factor)}</td></tr>
    <tr><td>معامل الكيلومترات</td><td>${pct(f.km_factor)}</td></tr>
    <tr><td>معامل المواصفات</td><td>${pct(f.spec_factor)}</td></tr>
    <tr><td>معامل الحالة</td><td>${pct(f.condition_factor)}</td></tr>`;
  $('result').classList.remove('hide');
}

$('brand').addEventListener('change', fillModels);
$('calc').addEventListener('click', calc);
fillBrands(); fillYears(); calc();
</script>
</body>
</html>
